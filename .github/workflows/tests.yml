name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # dlib takes ~10 minutes to compile; the tests use a fake face_recognition module instead.
      - run: pip install streamlit numpy pandas pillow pytest
      - run: pytest -q
